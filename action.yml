name: skillscope
description: Run one skillscope command against the calling repository.

# One skillscope command, at the version you referenced this action at.
#
#   - uses: amd/skillscope@v0.1.1
#     with:
#       command: structural
#
# The ref is the version. Actions downloads this repository at `v0.1.1` to run
# the action, and that checkout is the harness, so the step installs it from
# there rather than fetching a build named somewhere else. There is no second
# place holding a version that could disagree with the ref, and nothing to keep
# in step at release time.
#
# `version` is the one way to run a different build than the ref pins -- a
# caller trying next month's harness against today's workflow -- and the only
# case that reaches the network.
#
# Everything about the repo being tested is passed in: `skills` and `repo`
# here, and the rest through `args`, composed by the workflow that calls this.

inputs:
  command:
    description: 'The skillscope subcommand: structural, routing, behavioral, select, list-skills, template.'
    required: true
  args:
    description: "Further arguments for the subcommand, shell-quoted."
    required: false
    default: ""
  version:
    description: >-
      A harness build to fetch instead of the one this action's ref points at:
      a tag, a branch, or a commit. Blank is the usual answer, and the one that
      cannot drift from the ref you pinned.
    required: false
    default: ""
  skills:
    description: >-
      Globs naming the directories that are skills, comma-separated, relative
      to the repository root. Default: ./*, every directory at the root.
    required: false
    default: ""
  repo:
    description: "Root of the repo to test. Default: the workspace."
    required: false
    default: "."
  stdin:
    description: "A file to feed the command on stdin (`select --changed` reads one)."
    required: false
    default: ""
  python-version:
    description: "Python for the harness. Default: 3.12."
    required: false
    default: "3.12"
  setup-python:
    description: "Set up Python. Turn off on a runner where it is already pinned."
    required: false
    default: "true"
  install-claude:
    description: >-
      Install Node and the claude CLI. Needed by `routing` and `behavioral`,
      pointless for `structural` and `select`.
    required: false
    default: "false"
  node-version:
    description: "Node for the claude CLI. Default: 20."
    required: false
    default: "20"

outputs:
  version:
    description: "The harness build that ran."
    value: ${{ steps.skillscope.outputs.version }}
  stdout:
    description: >-
      The last line of the command's output. For `select` that is the plan
      JSON; other commands report through the step summary.
    value: ${{ steps.skillscope.outputs.stdout }}

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Node
      if: inputs.install-claude == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install the claude CLI
      if: inputs.install-claude == 'true'
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    # One step, in Python, because the same launcher runs on Linux, Windows,
    # and macOS runners and a shell script would need three of itself.
    - name: Run skillscope
      id: skillscope
      shell: python
      env:
        SKILLSCOPE_COMMAND: ${{ inputs.command }}
        SKILLSCOPE_ARGS: ${{ inputs.args }}
        SKILLSCOPE_REPO: ${{ inputs.repo }}
        SKILLSCOPE_SKILLS: ${{ inputs.skills }}
        SKILLSCOPE_STDIN: ${{ inputs.stdin }}
        SKILLSCOPE_VERSION: ${{ inputs.version }}
        # Only read when `version` asks for a build from git. Falls back to the
        # repository running the workflow, which is what `uses: ./` means.
        SKILLSCOPE_REPOSITORY: ${{ github.action_repository || github.repository }}
        # The harness itself: this repository, at the ref the caller pinned.
        SKILLSCOPE_ACTION_PATH: ${{ github.action_path }}
      run: |
        import os
        import runpy
        import sys

        launcher = os.path.join(os.environ["SKILLSCOPE_ACTION_PATH"], "action", "launch.py")
        sys.argv = [launcher]
        runpy.run_path(launcher, run_name="__main__")
