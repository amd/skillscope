name: skill-evals
# A worked example of grading a repo's skills

on:
  pull_request:
    paths:
      - "TraceLens/Agent/Analysis/skills/**"
      - ".github/workflows/skill-evals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    uses: danielholanda/skillscope/.github/workflows/reusable.yml@main
    secrets:
      api_key: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      skills: |
        TraceLens/Agent/Analysis/skills/analysis-orchestrator
      # Each step can be set to `required`, `optional`, or `off`.
      structural: required
      routing: required
      behavioral: optional
