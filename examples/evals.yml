name: skill-evals
# A worked example of grading a repo's skills

on:
  pull_request:
    paths:
      - "TraceLens/Agent/Analysis/skills/**"
      - ".github/workflows/skill-evals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    uses: danielholanda/skillscope/.github/workflows/reusable.yml@main
    secrets: inherit
    with:
      skills: |
        TraceLens/Agent/Analysis/skills/analysis-orchestrator
      structural: required
      routing: required
      behavioral: optional

      # Any wrong routing decision fails that skill's leg. Drop it to "0" to
      # report the score without gating on it, or to something in between to
      # hold a bar short of perfect.
      min_accuracy: "1"

      api_key_secret: ANTHROPIC_API_KEY
