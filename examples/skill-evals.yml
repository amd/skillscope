name: skill-evals

# A worked example of calling skillscope from a product repo. Copy it to
# .github/workflows/skill-evals.yml and edit the `with:` block, which is the
# whole configuration: there is no config file to add.

on:
  pull_request:
    paths:
      # A skill's description and prompts are the inputs to a routing decision,
      # and its body is the input to a behavior run. Nothing else here matters,
      # so nothing else pays for a run.
      - "skills/**"
      - "**/*.md"
      - ".github/workflows/skill-evals.yml"
  schedule:
    # Mondays at noon UTC, for link rot in markdown nobody is editing.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      skills:
        description: "Comma-separated skills to run. Blank runs all of them."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  skill-evals:
    uses: amd/skillscope/.github/workflows/skill-evals.yml@bootstrap
    # The called workflow reads the API key by the name given below, and an
    # environment-scoped secret is readable only inside the job that declares
    # the environment -- which is why the name is passed instead of the value.
    secrets: inherit
    with:
      # --- where the skills are ---
      skill_globs: skills/*

      # --- who is in the room for a routing run ---
      #
      # List the skills whose descriptions could plausibly be confused for one
      # another, and leave it blank if there is only one skill here: a routing
      # score with nothing to compete against measures nothing. Every listed
      # skill is installed in one workspace and every listed skill's prompts are
      # graded against that workspace, so adding a skill here also adds its
      # prompts as negatives for the others.
      routing_skills: my-skill,its-neighbour

      # --- what a change to CI itself means ---
      #
      # This file holds the routing set and the runner topology, so a change to
      # it re-runs every skill rather than whatever the diff happened to touch.
      infra_paths: .github/workflows/skill-evals.yml

      # --- which markdown is held to the reference checks ---
      #
      # The skills always are: a link that goes nowhere is a link the agent
      # follows and then improvises around. Naming your own docs holds them to
      # the same bar. `external_references` adds a job that fetches every URL;
      # leave that one out of branch protection, since a rate limit or a
      # blocked runner IP is not a reason to hold a merge.
      doc_globs: "*.md,docs/**/*.md"
      external_references: true
      # excluded_urls: '^https://intranet\.example\.com/'
      #
      # The weekly run is here for link rot alone, so it skips the graded
      # runs: `references` leaves the two free jobs and nothing that spends a
      # token.
      mode: ${{ github.event_name == 'schedule' && 'references' || 'both' }}

      # --- where behavior cases run ---
      #
      # GitHub-hosted Linux is the default. A skill that needs particular
      # hardware asks for the label in its own evals/machine.yml; those legs
      # start from `scoped_runner` instead, wait for `scoped_gate` to appear on
      # the pull request, and read their credentials from `scoped_environment`.
      behavior_runner: '["ubuntu-latest"]'
      behavior_os: Linux
      # scoped_runner: '["self-hosted"]'
      # scoped_gate: enable_gpu_ci
      # scoped_environment: gpu-evals

      # --- this run ---
      #
      # `version` is the build of the harness that grades this repo. A tag once
      # skillscope cuts releases; a skill can pin its own with
      # `skillscope_version` in its evals.json, next to the prompts it affects.
      version: main
      skills: ${{ inputs.skills }}
      # Any wrong routing decision fails the run. Drop it to "0" to report the
      # score without gating while you find out what your prompts score, or to
      # something in between to hold a bar short of perfect.
      min_accuracy: "1"
      api_key_secret: ANTHROPIC_API_KEY
