# Run skillscope on evals.json (same intake criteria as amd/skills)

name: AMD Skills Checks

on:
  pull_request:
    paths:
      - "path/to/your/skills/skill-name/**"
      - ".github/workflows/skill-evals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: AMD Skills Checks
    uses: amd/skillscope/.github/workflows/reusable.yml@main
    secrets:
      api_key: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      skills: path/to/your/skills/skill-name
      # Each step can be set to `required`, `optional`, or `off`.
      # On amd/skills, all steps are required.
      structural: required
      routing: required
      behavioral: required