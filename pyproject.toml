[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscope"
version = "0.1.3"
description = "Routing and behavioral test harness for agent skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Advanced Micro Devices, Inc." }]

# Every engine runs under inspect_ai, so it is required rather than optional.
#
# Only PyYAML is required. The commands that need no agent -- `structural`,
# `select`, `list-skills`, `template` -- import none of the eval stack, so a
# repo running only those installed 86 packages to use 2. That is the normal
# adoption order now that the dataset bar is configurable: the folder,
# frontmatter and reference checks come first and the datasets come later, and
# such a repo spends no tokens and still pulled an HTTP stack and a model
# client to check that markdown links resolve.
#
# The eval stack was an extra once, while the `legacy` engine existed, and was
# promoted to required when `legacy` went: keeping it an extra then shipped a
# tool whose graded commands all failed on a plain install with a bare
# `ModuleNotFoundError`. That reasoning still holds, and is now answered by a
# message rather than by a dependency. `engine.require` names the extra, and
# `bootstrap/launch.py` installs it for the commands that need it, so nobody
# arrives at the traceback the promotion was protecting against.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# The eval engine: everything the graded commands need and the light ones
# never import. `bootstrap/launch.py` asks for it by command, so a consumer
# workflow names no extra and nothing downstream changes.
#
# `anthropic` is listed explicitly: inspect-ai treats every model provider as
# optional, so installing it alone gets you a harness that cannot reach a model.
#
# `agent-client-protocol` is inspect-ai's own dependency, bounded here because its
# 1.0.0 dropped `acp.helpers`, which inspect-ai imports whenever `eval()` runs
# (https://github.com/UKGovernmentBEIS/inspect_ai/issues/6417). Remove the bound
# once an inspect-ai release supports 1.0.
#
# The name is the one it had before the promotion, so `skillscope[inspect]` in
# a downstream pin keeps resolving, and `podman` and `verify` go on chaining
# through it unchanged.
inspect = [
    "inspect-ai>=0.3.263",
    "agent-client-protocol<1",
    "anthropic>=0.40",
]

# For a runner that has podman rather than docker. The provider registers
# itself through an `inspect_ai` entry point, so installing it is the whole
# setup; `SKILLSCOPE_SANDBOX=podman` then selects it.
podman = ["skillscope[inspect]", "inspect-podman"]

# The Claude Code verification leg (`--engine claude-code`). Kept out of the
# `inspect` extra because it is a reporting-only cross-check, not something a
# graded run needs -- and because it only works on a POSIX guest.
#
# 0.2.71 for `claude_code(effort=)`. Not cosmetic: without it this leg runs at
# the model's default reasoning effort while every other leg runs at the one it
# was given, and the gap between them reads as a fact about isolation. 0.2.70
# raises `TypeError: Unexpected keyword argument(s): effort`, and a runner that
# already had it satisfied the old floor and never upgraded -- so the trial
# installed a version that could not run the leg.
verify = ["skillscope[inspect]", "inspect-swe>=0.2.71"]

[project.scripts]
skillscope = "skillscope.cli:main"

[tool.setuptools]
packages = ["skillscope", "skillscope.engine", "skillscope.harness"]

[tool.setuptools.package-data]
skillscope = ["data/*.json", "schema/*.json"]
