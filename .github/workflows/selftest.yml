name: selftest

# The harness testing itself. No agent, no tokens, no network.
#
# Two halves. The unit suite guards the parts that decide whether a paid run is
# trustworthy -- routing verdicts, activation detection, dataset rejection --
# and runs on every platform a behavioral leg can be scheduled on, because that
# is where the path handling breaks. The smoke test drives the real action
# against a throwaway repo built in the job, which is the only way to find out
# that action.yml and the CLI still agree on their interface.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Run the suite
        run: python -m unittest discover -s tests -t . --verbose

  engine:
    name: Inspect engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both sandboxes a run can get. Ubuntu has Docker, which is the default
        # and what CI uses; Windows has none, which is the other supported
        # shape. The Windows leg is the only place the cross-platform tools are
        # exercised at all -- inspect's own assume a POSIX guest.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # inspect-ai pulls in the order of eighty packages, so the download
          # is most of this step. Keyed on pyproject, which is where the extra
          # is declared and the only thing that changes what gets installed.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the inspect extra
        run: python -m pip install --upgrade pip && python -m pip install ".[inspect]"

      # `mockllm` reaches no provider, so this needs no key and runs on a pull
      # request from a fork. It cannot tell us whether a skill is any good --
      # the mock does no work and every judged expectation fails. What it does
      # tell us is whether the machinery around the model still holds together
      # on both platforms, which is where every bug so far has been.
      - name: Build a repo to test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture/demo-skill/evals fixture/demo-skill/fixtures
          cat > fixture/demo-skill/SKILL.md <<'EOF'
          ---
          name: demo-skill
          description: Does demonstrable things, for a test that needs a skill.
          ---
          EOF
          echo "seeded by the case, not produced by the agent" \
            > fixture/demo-skill/fixtures/seeded.txt
          cat > fixture/demo-skill/evals/evals.json <<'EOF'
          {
            "evaluations": [
              {"id": "demo-a", "skill_should_trigger": true, "prompt": "do the demo thing",
               "workspace": "fixtures", "files_exist": ["seeded.txt"]},
              {"id": "demo-b", "skill_should_trigger": true, "prompt": "another way to ask"},
              {"id": "demo-c", "skill_should_trigger": true, "prompt": "a third phrasing"},
              {"id": "demo-d", "skill_should_trigger": false, "prompt": "something adjacent"},
              {"id": "demo-e", "skill_should_trigger": false, "prompt": "something else entirely"}
            ]
          }
          EOF

      # `SKILLSCOPE_REPO` rather than `working-directory`, because a `--skills-dir`
      # glob that was passed is resolved against the repo root and `find_root`
      # takes that from the nearest `.git`. Running from a subdirectory of a
      # checkout would therefore still glob the checkout. Same thing `repo:`
      # does for the action.
      #
      # Exits non-zero because the mock satisfies nothing; the report is the
      # artifact under test, not the exit code.
      - name: Grade the fixture on the inspect engine
        continue-on-error: true
        env:
          SKILLSCOPE_REPO: fixture
        run: >
          python -m skillscope behavioral --engine inspect
          --model mockllm/model --skills-dir '*' --skill demo-skill
          --output engine-report.json

      - name: Check the machinery held
        shell: python
        env:
          EXPECTED_SANDBOX: ${{ matrix.os == 'windows-latest' && 'local' || 'docker' }}
        run: |
          import json
          import os

          report = json.load(open("engine-report.json", encoding="utf-8"))
          meta, totals = report["meta"], report["totals"]
          print(json.dumps(meta, indent=2))

          # An infrastructure failure is not a graded result. This is what
          # catches a sandbox that would not start.
          assert totals["errors"] == 0, report["cases"]

          expected = os.environ["EXPECTED_SANDBOX"]
          assert meta["sandbox"] == expected, f"ran in {meta['sandbox']!r}, wanted {expected!r}"

          checks = [c for case in report["cases"] for c in case["checks"]]
          assert checks, "nothing was graded, so nothing was proven"

          # A sandbox that cannot be listed reports the same shape as an agent
          # that produced nothing, so the difference is asserted explicitly.
          broken = [c for c in checks if "could not list the sandbox" in (c["detail"] or "")]
          assert not broken, broken

          # The seeded file exists because the case put it there, not because
          # the mock did anything. It passing proves the whole path: the fixture
          # was staged into the working directory, the directory was listed, and
          # the listing was matched against what the case asked for.
          seeded = [c for c in checks if c["kind"] == "files_exist"]
          assert seeded, "the seeded-file check did not run"
          assert all(c["passed"] for c in seeded), seeded
          print(f"{len(checks)} checks graded, seeded fixture found, sandbox {expected}.")

  action:
    name: Action against a throwaway repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Laid out the way the default glob expects one: skills at the root, so
      # not a step below passes `skills`, which is the configuration a repo
      # starting from nothing has.
      - name: Build a repo to test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture/demo-skill/evals
          cat > fixture/demo-skill/SKILL.md <<'EOF'
          ---
          name: demo-skill
          description: Does demonstrable things, for a test that needs a skill.
          ---
          EOF
          cat > fixture/demo-skill/skill-card.md <<'EOF'
          # Skill Card

          ## Description

          Does demonstrable things.

          ## Owner

          The skillscope selftest.

          ## License

          MIT
          EOF
          cat > fixture/demo-skill/evals/evals.json <<'EOF'
          {
            "evaluations": [
              {"id": "demo-a", "skill_should_trigger": true, "prompt": "do the demo thing"},
              {"id": "demo-b", "skill_should_trigger": true, "prompt": "another way to ask"},
              {"id": "demo-c", "skill_should_trigger": true, "prompt": "a third phrasing"},
              {"id": "demo-d", "skill_should_trigger": false, "prompt": "something adjacent"},
              {"id": "demo-e", "skill_should_trigger": false, "prompt": "something else entirely"}
            ]
          }
          EOF

      # `uses: ./` runs this checkout, so a pull request tests the action and
      # the harness it is about to change.
      - name: Check the fixture structurally
        id: structural
        uses: ./
        with:
          command: structural
          # The card and its sections are a repo's own policy, so the fixture
          # asks for them the way a repo with a governance card would.
          args: --skill-files skill-card.md --skill-sections Description,Owner,License
          repo: fixture

      # The version story, end to end. Nothing here can fetch another build, so
      # the harness that just ran has to be the one in this checkout -- and the
      # action has to be able to say which one that was. It reports the version
      # rather than its own ref precisely because the reusable workflows reach
      # it through a nested checkout, where the ref is empty.
      - name: Check it ran the harness from this checkout
        shell: python
        env:
          REPORTED: ${{ steps.structural.outputs.version }}
        run: |
          import os
          import re

          pyproject = open("pyproject.toml", encoding="utf-8").read()
          declared = re.search(r'(?m)^version\s*=\s*"([^"]+)"', pyproject).group(1)
          reported = os.environ["REPORTED"]
          assert reported == declared, f"ran {reported!r}, but this checkout is {declared!r}"
          print(f"skillscope {reported}, from this checkout.")

      # This repo has no skills, so what is left is its own prose -- which is
      # exactly the half a harness for checking references should not be
      # allowed to get wrong about itself. `--docs` is also what makes a run
      # that finds no skill a real run rather than one that graded nothing.
      # Offline, so nothing here depends on the network being polite today.
      - name: Check this repo's own references
        uses: ./
        with:
          command: structural
          args: --docs '*.md,docs/**/*.md'

      - name: Select runs for a change
        id: select
        uses: ./
        with:
          command: select
          args: --all --routing-room demo-skill
          repo: fixture

      - name: Select runs without naming the routing set
        id: inferred
        uses: ./
        with:
          command: select
          args: --all
          repo: fixture

      - name: Select runs with routing turned off
        id: unrouted
        uses: ./
        with:
          command: select
          args: --all --routing-room none
          repo: fixture

      - name: Check the plan
        shell: python
        env:
          PLAN: ${{ steps.select.outputs.stdout }}
          INFERRED: ${{ steps.inferred.outputs.stdout }}
          UNROUTED: ${{ steps.unrouted.outputs.stdout }}
        run: |
          import json
          import os

          plan = json.loads(os.environ["PLAN"])
          assert plan["routing"] is True, plan
          # The fixture skill asserts nothing beyond routing, so it earns no
          # behavior leg. A plan that scheduled one would be scheduling a job
          # with nothing to grade.
          assert plan["default"] == [], plan
          print(json.dumps(plan, indent=2))

          # The fixture has one skill, so there is no room to choose between
          # and naming it would be the caller repeating back the only answer.
          inferred = json.loads(os.environ["INFERRED"])
          assert inferred["routing"] is True, inferred

          # `none` is how a repo says it does not want the run at all, and it
          # has to hold even where a room could have been worked out.
          unrouted = json.loads(os.environ["UNROUTED"])
          assert unrouted["routing"] is False, unrouted
